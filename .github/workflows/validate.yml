name: Validate APEX

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gvenzl/setup-oracle-sqlcl@v1
        with:
          version: latest

      - name: Check SQLcl
        run: sql -version
